# Only install package versions that have been public for at least 7 days (supply-chain safety; pnpm 11+
# enforces a minimum release age by default and rejects lockfiles that break it).
minimumReleaseAge: 10080

# esbuild (used by Vite) needs its install script. pnpm 10 reads onlyBuiltDependencies; pnpm 11+ reads allowBuilds.
onlyBuiltDependencies:
  - esbuild
allowBuilds:
  esbuild: true
